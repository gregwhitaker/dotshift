name: Release

on:
  push:
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: Version for a rehearsal (artifacts only; no GitHub release)
        required: true
        default: '0.0.0-dev'
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release version
        id: version
        env:
          VERSION_INPUT: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          version=$(python3 scripts/release.py version "$VERSION_INPUT")
          echo "version=$version" >> "$GITHUB_OUTPUT"

  checks:
    needs: metadata
    uses: ./.github/workflows/ci.yml

  build:
    needs: [metadata, checks]
    name: Package (${{ matrix.os }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: amd64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
          - runner: macos-15
            os: darwin
            arch: arm64
          - runner: macos-15-intel
            os: darwin
            arch: amd64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Build versioned archives
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          RELEASE_OS: ${{ matrix.os }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: python3 scripts/release.py build "$RELEASE_VERSION" --os "$RELEASE_OS" --arch "$RELEASE_ARCH"
      - name: Verify packaged native app
        if: runner.os == 'macOS'
        run: |
          make test-menubar
          make test-menubar-lifecycle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-${{ matrix.os }}-${{ matrix.arch }}
          path: build/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  source:
    needs: [metadata, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Archive tagged source and embedded dashboard
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: python3 scripts/release.py source "$RELEASE_VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-source
          path: build/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  assemble:
    needs: [metadata, build, source]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: package-*
          merge-multiple: true
          path: build/release
      - name: Require all platforms and generate checksums and Homebrew formula
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          python3 scripts/release.py assemble "$RELEASE_VERSION"
          cd build/release
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: build/release/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

  draft:
    if: github.event_name == 'push'
    needs: assemble
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: build/release
      - name: Create or refresh the draft without changing published releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            if test "$draft" != true; then
              echo "Refusing to replace a published release: $RELEASE_TAG" >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" build/release/* --clobber
          else
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" build/release/* --verify-tag --draft \
              --title "Dotshift $RELEASE_TAG" --generate-notes \
              --notes-file .github/release-notes.md "${flags[@]}"
          fi
